<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14110b"/><stop offset="0.55" stop-color="#20170b"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36a"/><stop offset="0.5" stop-color="#f6a400"/><stop offset="1" stop-color="#c86b00"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2418"/><stop offset="1" stop-color="#17181b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/></filter>
    <style>
      .title{font:800 28px 'DejaVu Sans', Arial, sans-serif;fill:#fff8e7;letter-spacing:-0.7px}
      .sub{font:500 12px 'DejaVu Sans', Arial, sans-serif;fill:#b7aa94}
      .label{font:700 11px 'DejaVu Sans', Arial, sans-serif;fill:#f5c662;letter-spacing:1.2px}
      .body{font:600 14px 'DejaVu Sans', Arial, sans-serif;fill:#fff3d0}
      .muted{font:500 11px 'DejaVu Sans', Arial, sans-serif;fill:#9f9483}
      .num{font:900 40px 'DejaVu Sans', Arial, sans-serif;fill:#ffd36a}
      .tiny{font:700 9px 'DejaVu Sans', Arial, sans-serif;fill:#20140a}
      .chiptext{font:800 11px 'DejaVu Sans', Arial, sans-serif;fill:#281706}
    </style>
  </defs>
  <rect width="390" height="844" rx="34" fill="#050505"/>
  <rect x="10" y="10" width="370" height="824" rx="28" fill="url(#bg)"/>
  <rect x="145" y="22" width="100" height="22" rx="11" fill="#050505" opacity=".8"/>
<text x="28" y="82" class="label">CONCEPT 3</text><text x="28" y="116" class="title">FryQuest Cards</text><text x="28" y="138" class="sub">Gamified entry cards that unlock the final score as you fill each stat.</text><rect x="24" y="160" width="342" height="126" rx="24" fill="url(#card)" stroke="#3a2a15" stroke-width="1" filter="url(#shadow)"/>
<text x="42" y="194" class="label">MISSION</text><text x="42" y="226" class="title" style="font-size:25px">Rate the Batch</text><text x="42" y="250" class="sub">Complete 4 stat cards to reveal today's fry rank.</text><rect x="24" y="310" width="163" height="150" rx="24" fill="url(#card)" stroke="#3a2a15" stroke-width="1" filter="url(#shadow)"/>
<text x="44" y="345" class="label">FLAVOR</text><text x="44" y="394" class="num" style="font-size:34px">8.5</text><rect x="44" y="420" width="123" height="10" rx="5" fill="#3a3022"/><rect x="44" y="420" width="85" height="10" rx="5" fill="#f6a400"/><rect x="203" y="310" width="163" height="150" rx="24" fill="url(#card)" stroke="#3a2a15" stroke-width="1" filter="url(#shadow)"/>
<text x="223" y="345" class="label">TEXTURE</text><text x="223" y="394" class="num" style="font-size:34px">7.0</text><rect x="223" y="420" width="123" height="10" rx="5" fill="#3a3022"/><rect x="223" y="420" width="85" height="10" rx="5" fill="#f6a400"/><rect x="24" y="488" width="163" height="150" rx="24" fill="url(#card)" stroke="#3a2a15" stroke-width="1" filter="url(#shadow)"/>
<text x="44" y="523" class="label">SAUCE</text><text x="44" y="572" class="num" style="font-size:34px">ON</text><rect x="44" y="598" width="123" height="10" rx="5" fill="#3a3022"/><rect x="44" y="598" width="123" height="10" rx="5" fill="#f6a400"/><rect x="203" y="488" width="163" height="150" rx="24" fill="url(#card)" stroke="#3a2a15" stroke-width="1" filter="url(#shadow)"/>
<text x="223" y="523" class="label">VIBE</text><text x="223" y="572" class="num" style="font-size:34px">9</text><rect x="223" y="598" width="123" height="10" rx="5" fill="#3a3022"/><rect x="223" y="598" width="85" height="10" rx="5" fill="#f6a400"/><rect x="24" y="678" width="342" height="72" rx="26" fill="#2b1e0e" stroke="#f6a400" stroke-width="1.5"/><text x="42" y="708" class="label">RANK PREVIEW</text><text x="42" y="737" class="title" style="font-size:24px">Golden Tier</text><text x="330" y="733" text-anchor="end" class="num" style="font-size:36px">8.1</text></svg>
