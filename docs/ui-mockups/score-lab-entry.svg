    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36a"/><stop offset="0.5" stop-color="#f6a400"/><stop offset="1" stop-color="#c86b00"/></linearGradient>
